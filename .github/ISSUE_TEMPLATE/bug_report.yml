name: Bug Report
description: Report a reproducible Pichi Voice bug.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the behavior observed in Pichi Voice and include reproducible steps.
        Remove private recordings, user content and credentials from logs and attachments.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Briefly describe what is broken.
      placeholder: Pichi Voice crashes when...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide exact steps a maintainer can follow.
      placeholder: |
        1. Open Pichi Voice
        2. Configure...
        3. Press...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: "1.2.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Mac
        - iPhone
        - iPad
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: "macOS 15.5, iOS 17.6 or iPadOS 17.6"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and selected model
      description: Include your device model, memory if known, and the speech or summary model in use.
      placeholder: "MacBook Air M2, 16 GB, GigaAM; or iPad model and speech model"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste relevant logs or crash output when available.
      render: text
    validations:
      required: false
  - type: upload
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Attach screenshots or a recording if they help explain the bug.
    validations:
      required: false
