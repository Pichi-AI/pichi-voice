name: Feature Request
description: Suggest an idea for Pichi Voice.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the Pichi Voice user problem, proposed behavior and acceptance criteria.
        Link any related issue or design discussion. Scope and review follow CONTRIBUTING.md.
        Requests in this repository do not require a FluidVoice Discussion.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
      placeholder: Users currently cannot...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the requested behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention workarounds or other approaches that were discussed.
    validations:
      required: false
