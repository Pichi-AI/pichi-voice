name: Coverage baseline measurement

on:
  push:
    branches: ['codex/coverage-baseline-5de03f7f67']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: coverage-baseline-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  SOURCE_REVISION: 59361675a1413361b9ea349830d523d5e982d002

jobs:
  native:
    name: Coverage ${{ matrix.scope }}
    if: ${{ !contains(github.event.head_commit.message, '[packages-only]') }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: macos
            scheme: Fluid
          - scope: ios-iphone
            scheme: PichiVoiceMobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create isolated measurement worktree
        run: git worktree add --detach ${{ runner.temp }}/coverage-worktree HEAD
      - name: Record immutable inputs
        working-directory: ${{ runner.temp }}/coverage-worktree
        run: |
          mkdir -p .build/coverage/reports
          git rev-parse HEAD > .build/coverage/reports/harness-revision.txt
          git rev-parse "$SOURCE_REVISION" > .build/coverage/reports/source-revision.txt
          git diff --name-only "$SOURCE_REVISION" HEAD > .build/coverage/reports/harness-delta.txt
          git ls-files Sources Vendor scripts/dev tools .codex > .build/coverage/reports/source-inventory.txt
          xcodebuild -version > .build/coverage/reports/xcode-version.txt
          sw_vers > .build/coverage/reports/os-version.txt
          df -h . > .build/coverage/reports/disk-before.txt
      - name: Create owned iPhone simulator
        if: matrix.scope == 'ios-iphone'
        working-directory: ${{ runner.temp }}/coverage-worktree
        run: |
          xcrun simctl list --json > .build/coverage/reports/simulator-inventory.json
          read -r device_type runtime < <(python3 - <<'PYCODE'
          import json
          from pathlib import Path
          data=json.loads(Path('.build/coverage/reports/simulator-inventory.json').read_text())
          kind=next(x['identifier'] for x in data['devicetypes'] if x['name']=='iPhone 17')
          runtime=next(x['identifier'] for x in data['runtimes'] if x['name']=='iOS 27.0' and x['isAvailable'])
          print(kind,runtime)
          PYCODE
          )
          udid=$(xcrun simctl create CoverageBaseline "$device_type" "$runtime")
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "$udid" > .build/coverage/reports/owned-simulator.txt
      - name: Build instrumented native targets once
        working-directory: ${{ runner.temp }}/coverage-worktree
        env:
          SCOPE: ${{ matrix.scope }}
          SCHEME: ${{ matrix.scheme }}
        run: |
          if [[ "$SCOPE" == macos ]]; then
            destination='platform=macOS,arch=arm64'
            signing=(CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO)
          else
            destination='generic/platform=iOS Simulator'
            signing=(CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES)
          fi
          xcodebuild -project Fluid.xcodeproj -scheme "$SCHEME" -configuration Debug             -destination "$destination" -derivedDataPath "$PWD/.build/coverage/DerivedData"             -clonedSourcePackagesDirPath "$PWD/.build/coverage/SourcePackages" -jobs 2             -enableCodeCoverage YES -resultBundlePath .build/coverage/build.xcresult             "${signing[@]}" build-for-testing 2>&1 | tee .build/coverage/reports/build.log
      - name: Configure existing isolated test host
        working-directory: ${{ runner.temp }}/coverage-worktree
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          python3 - <<'PYCODE'
          import importlib.util,os,plistlib,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('regression','scripts/dev/macos-regression.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          products=Path('.build/coverage/DerivedData/Build/Products')
          paths=list(products.glob(os.environ['SCHEME']+'_*.xctestrun'))
          assert len(paths)==1,paths
          value=plistlib.loads(paths[0].read_bytes())
          environment=dict(os.environ)
          environment['TEST_RUNNER_FLUID_EXPORT_TEST_SANDBOX_TEMP']=subprocess.check_output(['getconf','DARWIN_USER_TEMP_DIR'],text=True).strip()
          module.configure_targets(value,environment)
          def host(node):
              if isinstance(node,dict):
                  if 'MobileIntegrationTests' in str(node.get('TestBundlePath','')):
                      node.setdefault('EnvironmentVariables',{})['PICHI_MOBILE_HOSTED_FIXTURE']='1'
                  for child in node.values():host(child)
              elif isinstance(node,list):
                  for child in node:host(child)
          host(value)
          (products/'coverage.xctestrun').write_bytes(plistlib.dumps(value))
          PYCODE
      - name: Execute existing tests with coverage
        working-directory: ${{ runner.temp }}/coverage-worktree
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          if [[ "$SCOPE" == macos ]]; then
            destination='platform=macOS,arch=arm64'
            exclusions=(-skip-testing:FluidDictationIntegrationTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture)
          else
            destination="platform=iOS Simulator,id=$SIMULATOR_UDID"
            exclusions=()
          fi
          xcodebuild -xctestrun .build/coverage/DerivedData/Build/Products/coverage.xctestrun             -destination "$destination" -enableCodeCoverage YES -parallel-testing-enabled NO             -test-timeouts-enabled YES -default-test-execution-time-allowance 60             -maximum-test-execution-time-allowance 180 -resultBundlePath .build/coverage/tests.xcresult             "${exclusions[@]}" test-without-building 2>&1 | tee .build/coverage/reports/tests.log
      - name: Export coverage and actual test accounting
        if: always()
        working-directory: ${{ runner.temp }}/coverage-worktree
        run: |
          if [[ -d .build/coverage/tests.xcresult ]]; then
            xcrun xccov view --report --json .build/coverage/tests.xcresult > .build/coverage/reports/xccov.json
            xcrun xccov view --archive --file-list .build/coverage/tests.xcresult > .build/coverage/reports/coverage-files.txt
            xcrun xcresulttool get test-results summary --path .build/coverage/tests.xcresult --compact > .build/coverage/reports/test-summary.json
            python3 -S scripts/dev/macos-regression.py summarize .build/coverage/reports/test-summary.json 0
          else
            exit 1
          fi
      - name: Upload small metrics and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-metrics-${{ matrix.scope }}
          path: ${{ runner.temp }}/coverage-worktree/.build/coverage/reports
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Preserve native result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-xcresult-${{ matrix.scope }}
          path: ${{ runner.temp }}/coverage-worktree/.build/coverage/tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
      - name: Release owned simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
  packages:
    name: Coverage Swift packages
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git worktree add --detach ${{ runner.temp }}/coverage-worktree HEAD
      - name: Run package-owned tests with compiler coverage
        working-directory: ${{ runner.temp }}/coverage-worktree
        run: |
          mkdir -p .build/coverage/reports
          xcodebuild -version > .build/coverage/reports/xcode-version.txt
          git rev-parse HEAD > .build/coverage/reports/harness-revision.txt
          git rev-parse "$SOURCE_REVISION" > .build/coverage/reports/source-revision.txt
          status=0
          for package in NativeTextInference PichiGigaAM RussianMorphology TranscribeCpp; do
            scratch="$PWD/.build/coverage/packages/$package"
            swift test --package-path "Vendor/$package" --scratch-path "$scratch" --jobs 2               --enable-code-coverage --xunit-output "$PWD/.build/coverage/reports/$package.xml"               > ".build/coverage/reports/$package.log" 2>&1 || status=1
            python3 - "$scratch" "$package" <<'PYCODE'
            import json,subprocess,sys
            from pathlib import Path
            scratch=Path(sys.argv[1]);package=sys.argv[2]
            reports=Path('.build/coverage/reports')
            raw=list(scratch.glob('**/codecov/*.profraw'))
            binaries=[p for p in scratch.glob('**/*.xctest/Contents/MacOS/*') if p.is_file() and not p.is_symlink()]
            assert raw and binaries,(len(raw),len(binaries))
            manifest={'raw_profiles':[str(p) for p in raw],'objects':[str(p) for p in binaries]}
            (reports/(package+'-objects.json')).write_text(json.dumps(manifest,indent=2))
            profile=reports/(package+'.profdata')
            subprocess.run(['xcrun','llvm-profdata','merge','-sparse',*[str(p) for p in raw],'-o',str(profile)],check=True)
            command=['xcrun','llvm-cov','export','-instr-profile='+str(profile),str(binaries[0])]
            for binary in binaries[1:]:command+=['-object',str(binary)]
            with (reports/(package+'-all-targets.json')).open('w') as stream:subprocess.run(command,stdout=stream,check=True)
            PYCODE
          done
          exit "$status"
      - name: Upload package coverage and test accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-metrics-packages
          path: ${{ runner.temp }}/coverage-worktree/.build/coverage/reports
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
