name: Pichi Voice native verification

on:
  workflow_call:
    inputs:
      full_baseline:
        description: Validate every coverage scope even when unchanged
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_baseline:
        description: Validate every coverage scope even when unchanged
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pichi-native-isolated
  cancel-in-progress: false

jobs:
  native:
    name: Coverage gate
    runs-on: [self-hosted, macOS, ARM64, pichi-voice-isolated]
    timeout-minutes: 90
    env:
      NATIVE_ROOT: ${{ github.workspace }}-native-${{ github.run_id }}-${{ github.run_attempt }}
      CI_ROOT: ${{ github.workspace }}-native-${{ github.run_id }}-${{ github.run_attempt }}/worktree
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require the prepared isolated runner
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "${PICHI_ISOLATED_NATIVE_RUNNER:-}" = 1
          test -n "${DEVELOPER_DIR:-}"
          xcodebuild -version
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create independently recoverable native worktree
        id: workspace
        run: |
          mkdir "$NATIVE_ROOT"
          echo 'owned=true' >> "$GITHUB_OUTPUT"
          git clone --no-local --mirror "$GITHUB_WORKSPACE" "$NATIVE_ROOT/repository.git"
          git --git-dir="$NATIVE_ROOT/repository.git" worktree add --detach "$CI_ROOT" "$GITHUB_SHA"
      - working-directory: ${{ env.CI_ROOT }}
        run: |
          python3 -m venv .build/coverage-venv
          .build/coverage-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir coverage==7.17.2
      - name: Execute selected native contracts and full coverage gate
        timeout-minutes: 80
        working-directory: ${{ env.CI_ROOT }}
        env:
          FULL_BASELINE: ${{ inputs.full_baseline }}
        run: |
          pichi_options=()
          if [[ "$FULL_BASELINE" == true ]]; then pichi_options+=(--all); fi
          .build/coverage-venv/bin/python scripts/dev/coverage-ci.py verify --output .build/coverage "${pichi_options[@]}"
      - name: Release recorded simulators even after cancellation
        id: devices
        if: always() && steps.workspace.outputs.owned == 'true'
        run: |
          if [[ ! -d "$CI_ROOT" ]]; then exit 0; fi
          mkdir -p "$CI_ROOT/.build/coverage"
          python3 -B -S scripts/dev/coverage-ci.py cleanup --root "$CI_ROOT" --output "$CI_ROOT/.build/coverage" > "$CI_ROOT/.build/coverage/cleanup.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always() && steps.workspace.outputs.owned == 'true'
        with:
          name: native-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_ROOT }}/.build/coverage/*.json
            ${{ env.CI_ROOT }}/.build/coverage/*.log
            ${{ env.CI_ROOT }}/.build/coverage/macos/*/*.log
            ${{ env.CI_ROOT }}/.build/coverage/macos/*/*.json
            ${{ env.CI_ROOT }}/.build/coverage/ios/*/*.log
            ${{ env.CI_ROOT }}/.build/coverage/ios/*/*.json
            ${{ env.CI_ROOT }}/.build/coverage/ios/*/screenshots-*/*.png
            ${{ env.CI_ROOT }}/.build/coverage/packages/*/*.log
            ${{ env.CI_ROOT }}/.build/coverage/packages/*/*.lcov
            ${{ env.CI_ROOT }}/.build/coverage/python/*/tests.log
            ${{ env.CI_ROOT }}/.build/coverage/python/*/coverage.json
          if-no-files-found: error
          retention-days: 1
      - name: Release owned worktree after evidence preservation
        if: always() && steps.workspace.outputs.owned == 'true'
        env:
          EVIDENCE_SAVED: ${{ steps.evidence.outcome }}
          DEVICES_RELEASED: ${{ steps.devices.outcome }}
        run: |
          if [[ ! -d "$CI_ROOT" ]]; then
            rm -rf -- "$NATIVE_ROOT"
            exit 0
          fi
          if [[ "$EVIDENCE_SAVED" != success || "$DEVICES_RELEASED" != success ]]; then
            echo "::error::Preserve $NATIVE_ROOT; evidence or simulator cleanup needs recovery."
            exit 1
          fi
          rm -rf -- "$CI_ROOT/.build"
          if [[ -n "$(git -C "$CI_ROOT" status --porcelain --untracked-files=normal)" ]]; then
            echo "::error::Preserve $CI_ROOT; unexpected source or untracked changes remain."
            exit 1
          fi
          git --git-dir="$NATIVE_ROOT/repository.git" worktree remove "$CI_ROOT"
          rm -rf -- "$NATIVE_ROOT/repository.git"
          rmdir "$NATIVE_ROOT"
