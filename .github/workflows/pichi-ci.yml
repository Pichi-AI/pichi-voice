name: Pichi Voice CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pichi-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks and Python coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_ROOT: ${{ github.workspace }}/.build/pichi-portable
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: git worktree add --detach "$CI_ROOT" HEAD
      - working-directory: ${{ env.CI_ROOT }}
        run: bash scripts/dev/check.sh
      - id: plan
        working-directory: ${{ env.CI_ROOT }}
        run: python3 -S scripts/dev/coverage-ci.py plan --output .build/coverage/plan.json >> "$GITHUB_OUTPUT"
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir coverage==7.17.2
      - working-directory: ${{ env.CI_ROOT }}
        run: python3 scripts/dev/coverage-ci.py python --output .build/coverage
      - name: Enforce Python patch coverage
        if: always() && steps.plan.outcome == 'success'
        working-directory: ${{ env.CI_ROOT }}
        env:
          COVERAGE_BASE: ${{ steps.plan.outputs.base }}
          COVERAGE_HEAD: ${{ steps.plan.outputs.head }}
        run: >-
          python3 -S scripts/dev/coverage-gate.py
          --base "$COVERAGE_BASE" --head "$COVERAGE_HEAD"
          --python-only --require-scope python
          --reports-dir .build/coverage --output .build/coverage/python-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-coverage
          path: |
            ${{ env.CI_ROOT }}/.build/coverage/*.json
            ${{ env.CI_ROOT }}/.build/coverage/python/*/tests.log
            ${{ env.CI_ROOT }}/.build/coverage/python/*/coverage.json
          if-no-files-found: warn
          retention-days: 1
