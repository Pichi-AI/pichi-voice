name: Pichi Voice CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pichi-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: bash scripts/dev/setup.sh --allow-primary

  macos:
    name: macOS integration tests
    if: github.event_name == 'workflow_dispatch' || vars.PICHI_VOICE_MACOS_CI == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Create isolated build worktree
        run: git worktree add --detach ../pichi-voice-ci HEAD
      - name: Run macOS tests
        working-directory: ../pichi-voice-ci
        run: bash scripts/dev/macos.sh test
