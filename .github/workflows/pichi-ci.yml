name: Pichi Voice CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_macos:
        description: Run the full macOS integration suite
        type: boolean
        required: false
        default: false
      run_ios:
        description: Compile the shared sources for iPhone and iPad Simulator
        type: boolean
        required: false
        default: false
      macos_runner:
        description: Standard macOS runner, with Intel fallback for ARM capacity outages
        type: choice
        required: false
        default: macos-latest
        options:
          - macos-latest
          - macos-26-intel

permissions:
  contents: read

concurrency:
  group: pichi-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: bash scripts/dev/setup.sh --allow-primary

  macos:
    name: macOS integration tests
    if: (github.event_name == 'workflow_dispatch' && inputs.run_macos) || vars.PICHI_VOICE_MACOS_CI == 'true'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_runner == 'macos-26-intel' && 'macos-26-intel' || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Create isolated build worktree
        run: git worktree add --detach ../pichi-voice-ci HEAD
      - name: Run macOS tests
        working-directory: ../pichi-voice-ci
        run: bash scripts/dev/macos.sh test

  ios:
    name: iOS simulator build
    if: github.event_name == 'workflow_dispatch' && inputs.run_ios
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Create isolated build worktree
        run: git worktree add --detach ../pichi-voice-ios-ci HEAD
      - name: Check shared-source membership
        working-directory: ../pichi-voice-ios-ci
        run: python3 scripts/dev/update-mobile-project.py --check
      - name: Build iPhone and iPad Simulator app
        working-directory: ../pichi-voice-ios-ci
        run: |
          xcodebuild -project Fluid.xcodeproj -scheme PichiVoiceMobile \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios/DerivedData \
            -clonedSourcePackagesDirPath .build/ios/SourcePackages -jobs 4 \
            CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
