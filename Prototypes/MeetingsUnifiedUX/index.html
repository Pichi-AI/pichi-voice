function list(){return `<aside class="list-pane"><div class="list-head"><h2>Встречи<span class="list-count">${state==='empty'?'0':'4'}</span></h2><button class="btn ${(isLive()||processingActive)?'secondary':'primary'} wide" aria-disabled="${isLive()||processingActive}" title="${(isLive()||processingActive)?'Сначала завершите текущую встречу':'Начать новую встречу'}" data-action="new">${icon('plus')}Новая встреча</button><label class="search">${icon('search')}<input id="meeting-search" placeholder="Поиск по названию" aria-label="Поиск встреч"></label><div class="filters"><button class="filter on" aria-pressed="true" data-filter="all">Все</button><button class="filter" aria-pressed="false" data-filter="room">В комнате</button><button class="filter" aria-pressed="false" data-filter="online">Онлайн</button></div></div><div class="list-content" id="meeting-list">${state==='empty'?'<div class="empty-search">Здесь появятся ваши встречи.</div>':`${(isLive()||processingActive||recoveryActive)?`<div class="date-label">Текущая встреча</div><button class="meeting-row live-row ${processingActive?'processing-row':''}" data-action="live"><span class="row-title">Обсуждение нового интерфейса</span><span class="row-meta">Микрофон · Встреча в комнате</span><span class="row-state"><i class="dot"></i>${processingActive?'Обрабатывается':recoveryActive?'Прервано':captureHealth==='degraded'?'Источник потерян':'Идёт запись'} · 12:48</span></button>`:''}<div class="date-label">Сегодня, 18 октября</div>${(isLive()||processingActive||recoveryActive)?'':row(0,selectedIndex===0&&state==='saved')}${row(1,selectedIndex===1&&(state==='browse'||state==='saved'))}<div class="date-label">Вчера, 17 октября</div>${row(2,selectedIndex===2&&(state==='browse'||state==='saved'))}${row(3,selectedIndex===3&&(state==='browse'||state==='saved'))}`}</div><div class="list-footer">${icon('lock')} Встречи хранятся на этом устройстве</div></aside>`}
function turns(live=false){return `<div class="turn ${live?'live':''}"><div class="timestamp">${live?'11:42':'00:18'}</div><div>${!live?'<div class="speaker">Участник 1</div>':''}<p>Давайте объединим текущую встречу и прошлые разговоры в одном пространстве. Тогда не придётся искать результат в другом разделе.</p></div></div><div class="turn ${live?'live':''}"><div class="timestamp">${live?'12:03':'00:46'}</div><div>${!live?'<div class="speaker two">Участник 2</div>':''}<p>А во время записи должно быть сразу понятно, что микрофон работает и разговор сохраняется.</p></div></div>${!live?'<div class="turn"><div class="timestamp">01:12</div><div><div class="speaker">Участник 1</div><p>Да. И важно вернуться к этой встрече после завершения без смены экрана.</p></div></div>':''}`}
function source(){return `<div class="source-strip">${icon('lock')}Локальная обработка · Аудио сохраняется на устройстве</div>`}
function documentToolbar(){return `<div class="detail-top"><div class="breadcrumb">Встречи / ${selectedIndex<2?'Сегодня':'Вчера'}</div><div class="tools"><button class="btn secondary" data-action="export">${icon('export')}Экспорт</button><button class="icon-btn" aria-label="Другие действия" data-action="more">${icon('more')}</button></div></div>`}
function saved(){return `${documentToolbar()}<div class="detail-content"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:19px"><span class="eyebrow">${selectedIndex<2?'18':'17'} ОКТЯБРЯ · ${meetings[selectedIndex][1].split(' · ')[0]}</span><span class="status-badge">${icon('check')}Завершено</span></div><h1>${meetings[selectedIndex][0]}</h1><div class="subline">${meetings[selectedIndex][2]} · ${meetings[selectedIndex][1]}</div><div class="doc-tabs"><button class="doc-tab on" data-tab="transcript">Расшифровка</button>${concept==='ipad'?'':'<button class="doc-tab" data-tab="summary">Итоги</button>'}</div><div id="document-body"><div class="doc-intro"><span>Участники определены после обработки</span><span>Поиск в тексте ⌘F</span></div>${turns()}${source()}</div></div><div class="document-footer"><span>Сохранено на этом устройстве</span><span>Текст можно редактировать</span></div>${state==='browse'?dock():processingActive?processDock():recoveryActive?recoveryDock():''}`}
function recStatus(mobile=false){return `<div class="record-status"><div class="record-icon">${icon('mic')}</div><div><div class="record-label"><span class="dot"></span>${captureHealth==='degraded'?'Источник потерян':'Идёт запись'}</div><div class="record-source">${captureHealth==='degraded'?'Новая речь не записывается':'Встреча в комнате · '+(mobile?'Микрофон iPhone':concept==='ipad'?'Микрофон iPad':'Микрофон MacBook Pro')}</div></div><div class="timer">12:48</div></div>`}
function stop(){return `<button class="btn stop" data-action="stop"><span class="stop-square"></span>Завершить запись</button>`}
function controls(){return `<div class="record-controls"><div class="signal">${captureHealth==='degraded'?icon('alert'):captureHealth==='silence'?'<span style="font-size:20px">···</span>':wave(true,10)}<div><strong>${captureHealth==='degraded'?'Микрофон недоступен':captureHealth==='silence'?'Микрофон подключён':'Микрофон слышит звук'}</strong>${captureHealth==='degraded'?'Сохранённая часть доступна до 12:48':captureHealth==='silence'?'Сейчас тихо. Запись продолжается.':'Расшифровка появляется по ходу разговора'}</div></div>${stop()}</div>`}
function pending(){return captureHealth==='degraded'?'':captureHealth==='silence'?'<div class="notice">Сейчас тихо. Микрофон подключён, запись продолжается.</div>':`<div class="pending">${wave()}<small>Распознаём последнюю реплику…</small></div>`}
function recording(){return `${recStatus()}<div class="detail-content record-content"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="eyebrow">ТЕКУЩАЯ ВСТРЕЧА</span><button class="quiet" style="min-width:44px;min-height:44px" aria-label="Открыть режим фокуса" data-action="focus">${icon('expand')}</button></div><h1 style="margin-top:16px">Обсуждение нового интерфейса</h1><div class="live-note"><span class="dot"></span>Локальная обработка · Аудио сохраняется</div>${captureHealth==='degraded'?'<div class="notice warn">'+icon('alert')+' Микрофон недоступен. Новая речь сейчас не записывается.<br><button class="btn secondary" data-action="retry-source">Проверить источник</button></div>':''}<div class="live-heading"><strong>Расшифровка в реальном времени</strong><button class="follow" data-action="follow">↓ К последней реплике</button></div>${turns(true)}${pending()}<p class="subline" style="margin-left:58px;font-size:10px">Предварительный текст. Участники появятся после обработки.</p></div>${controls()}`}
function dock(){return `<div class="record-dock"><span class="dot"></span><strong>${captureHealth==='degraded'?'Источник потерян':'Запись продолжается'}</strong><span class="mini-time">12:48</span><button class="return" data-action="live">К текущей встрече</button>${stop()}</div>`}
function processDock(){return `<div class="record-dock" style="background:var(--accent-soft);color:var(--accent);border-color:var(--accent)"><strong>Готовим расшифровку</strong><span>Микрофон выключен</span><button class="return" data-action="live">К текущей встрече</button></div>`}
function recoveryDock(){return `<div class="record-dock"><strong>Запись прервана · до 12:48</strong><span>Новая речь не записывается</span><button class="return" data-action="live">К прерванной встрече</button></div>`}
function ready(empty=false){return `<div class="detail-top"><span class="breadcrumb">${empty?'Первая встреча':'Новая встреча'}</span></div><div class="detail-content" style="padding-top:66px"><span class="eyebrow">${empty?'ВАШИ РАЗГОВОРЫ, В ОДНОМ МЕСТЕ':'ГОТОВО К ЗАПИСИ'}</span><h1 style="margin-top:17px">${empty?'Начните первую встречу':'Новая встреча'}</h1><p class="subline">Текущая встреча и её расшифровка останутся здесь же.</p><div class="setup-card"><div class="setup-row"><div class="card-icon">${icon('mic')}</div><div><strong>Встреча в комнате</strong><small>Микрофон MacBook Pro</small></div><button class="quiet" style="margin-left:auto" data-action="source">Изменить</button></div><div class="source-strip" style="margin:0 0 22px">${icon('lock')}Локальная обработка · Аудио сохраняется</div><button class="btn primary wide" data-action="start">${icon('mic')}Начать запись</button></div><p class="subline" style="margin-top:18px;font-size:11px">Источник и хранение можно изменить до начала записи.</p></div>`}
function processing(){return `<div class="detail-top"><span class="breadcrumb">Текущая встреча</span></div><div class="center-state"><div class="state-symbol">${icon('file')}</div><span class="eyebrow">ЗАПИСЬ ЗАВЕРШЕНА</span><h1 style="margin-top:16px">Готовим расшифровку</h1><p class="subline">Обсуждение нового интерфейса · 12:48<br>Микрофон выключен. Можно открыть другие встречи.</p><div class="state-steps"><div>✓ Запись завершена</div><div><b>● Обрабатываем речь</b></div><div>○ Определим участников</div><div>○ Сохраним результат в этой встрече</div></div><div class="notice" style="text-align:left;margin-bottom:20px"><strong>Уже распознано</strong><p style="margin:8px 0 0">Давайте объединим текущую встречу и прошлые разговоры в одном пространстве.</p></div><button class="btn secondary" data-action="finish-demo">Показать готовый результат</button><p class="subline" style="font-size:10px;margin-top:12px">Переход для просмотра прототипа</p></div>`}
function recovery(){return `<div class="center-state"><div class="state-symbol">${icon('alert')}</div><h1>Запись прервалась</h1><p class="subline">Доступна сохранённая часть встречи до 12:48.<br>Новая речь сейчас не записывается.</p><div class="notice">В этом примере аудио сохранялось на устройстве. Можно повторить обработку сохранённой части.</div><button class="btn primary" style="margin-top:24px" data-action="retry">Обработать сохранённое</button><p class="subline" style="margin-top:20px;font-size:11px">При режиме без аудиофайлов восстановление зависит от доступного текста.</p></div>`}
function detail(){return `<section class="detail">${isLive()&&state!=='browse'?recording():state==='saved'||state==='browse'?saved():state==='processing'?processing():state==='recovery'?recovery():ready(state==='empty')}</section>`}
function timeline(){return `<section class="timeline"><div class="timeline-body"><div class="timeline-title"><div><span class="eyebrow">PICHI MEET</span><h1 style="margin-top:10px">Все ваши встречи</h1><p class="subline">Текущий разговор и история в одной ленте.</p></div><button class="btn ${isLive()?'secondary':'primary'}" data-action="new">${icon('plus')}Новая встреча</button></div>${isLive()?`<div class="timeline-active">${recStatus()}<div class="inner"><div class="eyebrow">ТЕКУЩАЯ ВСТРЕЧА</div><h2 style="margin:12px 0 18px">Обсуждение нового интерфейса</h2><div style="border-left:2px solid var(--accent);padding-left:18px"><p style="font-size:17px;line-height:1.7;margin-bottom:12px">А во время записи должно быть сразу понятно,<br>что микрофон работает и разговор сохраняется.</p><div class="subline">12:03 · Предварительный текст</div></div></div>${controls()}</div>`:`<div class="setup-card" style="max-width:none;margin-top:15px;display:flex;align-items:center;gap:20px"><div class="card-icon">${icon('mic')}</div><div style="flex:1"><h3 style="margin-bottom:6px">Начать новый разговор</h3><span class="subline">Встреча в комнате · Локальная обработка</span></div><button class="btn primary" data-action="start">Начать запись</button></div>`}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:28px;margin-bottom:15px"><h3 style="margin:0">Недавние встречи</h3><label class="search" style="margin:0;width:230px">${icon('search')}<input id="timeline-search" placeholder="Поиск встреч" aria-label="Поиск встреч в ленте"></label></div><div class="timeline-history">${meetings.map((m,i)=>(isLive()&&i===0)?'':`<button class="history-card" data-action="select" data-index="${i}"><span class="eyebrow">${i<2?'СЕГОДНЯ':'ВЧЕРА'}</span><strong>${m[0]}</strong><div class="subline">${m[1]}<br>${m[2]}</div></button>`).join('')}</div></div></section>`}
function focus(){return `<section class="focus-layout"><aside class="focus-rail"><h2>Встречи <span class="list-count">4</span></h2><button class="btn secondary wide" data-action="new">${icon('plus')}Новая встреча</button><div class="date-label">Текущая встреча</div><button class="meeting-row live-row ${processingActive?'processing-row':''}" data-action="live"><span class="row-title">Обсуждение нового интерфейса</span><span class="row-state"><i class="dot"></i>${processingActive?'Обрабатывается':recoveryActive?'Прервано':captureHealth==='degraded'?'Источник потерян':'Идёт запись'} · 12:48</span></button><div class="date-label">Сегодня</div>${row(1)}<div class="date-label">Вчера</div>${row(2,selectedIndex===2&&(state==='browse'||state==='saved'))}${row(3,selectedIndex===3&&(state==='browse'||state==='saved'))}<p class="subline" style="padding:20px 10px;font-size:11px">История доступна.<br>Запись продолжится при переходе.</p></aside><div class="focus-stage"><div class="focus-head"><span>Pichi Meet</span><button class="focus-mode-label" data-action="unfocus">${icon('expand')} Свернуть фокус</button></div><div class="focus-center"><div class="focus-rec-label"><span class="dot"></span>ИДЁТ ЗАПИСЬ</div><div class="focus-timer">12:48</div>${wave(true,35)}<h1>Обсуждение нового интерфейса</h1><span class="subline">Микрофон MacBook Pro · Встреча в комнате</span></div><div class="focus-quote"><div class="eyebrow">ПОСЛЕДНЯЯ РЕПЛИКА · 12:03</div><p>А во время записи должно быть сразу понятно, что микрофон работает и разговор сохраняется.</p><div class="subline">Распознаём последнюю реплику…</div></div><div class="focus-footer">${stop()}<div class="subline">Локальная обработка · Аудио сохраняется на устройстве</div></div></div></section>`}
function phone(which){return `<div><div class="phone ${which==='recording'?'dark':''}"><div class="phone-status"><span>9:41</span><span>●●●  ▰</span></div>${which==='saved'?`<div class="phone-head"><h1>Встречи</h1><button class="btn primary wide" data-action="start">${icon('plus')}Новая встреча</button><label class="search">${icon('search')}<input placeholder="Поиск по названию" aria-label="Поиск на iPhone"></label></div><div class="phone-content"><div class="date-label">Сегодня, 18 октября</div>${row(0)}${row(1)}<div class="date-label">Вчера, 17 октября</div>${row(2,selectedIndex===2&&(state==='browse'||state==='saved'))}${row(3,selectedIndex===3&&(state==='browse'||state==='saved'))}</div><div class="phone-tabs"><span class="selected">${icon('meet')}Встречи</span><span>${icon('settings')}Настройки</span></div>`:`<button class="phone-back" data-action="browse">${icon('back')}Все встречи · Запись продолжится</button>${recStatus(true)}<div class="record-content"><span class="eyebrow">ТЕКУЩАЯ ВСТРЕЧА</span><h1 style="margin-top:15px">Обсуждение<br>нового интерфейса</h1><div class="live-note"><span class="dot"></span>Локально · Без аудиофайлов</div><div class="live-heading"><strong>Расшифровка</strong><button class="follow" data-action="follow">↓ К последней</button></div>${turns(true)}${pending()}<p class="subline" style="font-size:10px">Сохраняется только текст.<br>Прослушивание аудио недоступно.</p></div>${controls()}`}</div><div class="board-label">${which==='saved'?'Единый список встреч':'Запись / тёмная тема / без аудиофайлов'}</div></div>`}
function render(){document.body.className=(params.has('shot')?'shot ':'')+(captureHealth==='degraded'?'degraded ':'')+(theme==='dark'?'dark ':'')+(concept==='ipad'?'ipad':'');$('#concept').value=concept;$('#state').value=state;$('#theme').value=theme;$('#root').innerHTML=concept==='mobile'?`<div class="mobile-board">${phone('saved')}${phone('recording')}</div>`:`<main class="app ${concept==='ipad'?'ipad':''}"><div class="chrome">${concept==='ipad'?'<span>9:41</span>':'<i class="traffic"></i><i class="traffic"></i><i class="traffic"></i>'}<span class="chrome-title">Pichi Meet</span><span class="prototype-tag">ДИЗАЙН-КОНЦЕПЦИЯ ${concept==='ipad'?'A / IPAD':concept.toUpperCase()}</span></div><div class="layout">${nav()}${concept==='b'&&!processingActive&&!recoveryActive&&['saved','recording','silence','degraded','ready'].includes(state)?timeline():concept==='c'&&state==='recording'?focus():list()+detail()}</div></main>`;$('#annotation').textContent=concept==='a'?'A. Рекомендованный вариант: слева список встреч, справа один документ на всех стадиях. Активная встреча закреплена. Красный акцент обозначает захват звука, фиолетовый сохраняется для навигации.':concept==='b'?'B. Лента: удобна для редких встреч и быстрого старта. Во время записи текущая встреча закреплена сверху; для длинного текста потребуется раскрыть документ.':concept==='c'?'C. Фокус: крупный таймер и последняя реплика помогают контролировать запись издалека. История остаётся доступной; этот режим лучше сделать дополнительным видом варианта A.':'Адаптация той же модели: на iPad две колонки, на iPhone список и документ с постоянным доступом к текущей записи.';bind();document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('on',x.dataset.filter===activeFilter);x.setAttribute('aria-pressed',String(x.dataset.filter===activeFilter))});if($('#meeting-search')&&activeFilter!=='all')filterRows('',activeFilter)}
function go(s,c=concept){if(['recording','silence','degraded'].includes(s))captureHealth=s;if(s==='processing'){processingActive=true;recoveryActive=false;}state=s;concept=c;const url=new URL(location);url.searchParams.set('state',state);url.searchParams.set('concept',concept);url.searchParams.set('theme',theme);history.replaceState(null,'',url);render()}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='live')go(processingActive?'processing':recoveryActive?'recovery':captureHealth);else if(a==='start'){if(processingActive||recoveryActive||isLive()){alert('Сначала завершите текущую встречу.');}else go('recording');}else if(a==='retry-source')go('recording');else if(a==='new'){if(isLive()||processingActive||recoveryActive){alert('Сначала завершите текущую встречу. Её статус остаётся в списке.');}else go('ready');}else if(a==='stop'||a==='retry')go('processing');else if(a==='finish-demo'){processingActive=false;captureHealth='recording';selectedIndex=0;meetings[0][1]='14:30 · 12 мин 48 с · 3 участника';go('saved');}else if(a==='select'){selectedIndex=Number(b.dataset.index||0);go(isLive()?'browse':'saved',concept==='b'?'a':concept);}else if(a==='browse'){selectedIndex=1;go('browse','a');}else if(a==='focus')go(captureHealth,'c');else if(a==='unfocus')go(captureHealth,'a');else if(a==='follow'){b.textContent=b.textContent.includes('следим')?'↓ К последней реплике':'✓ Следим за разговором'}else if(a==='source')alert('В прототипе показан источник «Встреча в комнате». Рабочие настройки приложения не меняются.');else if(a==='export')alert('Дизайн-прототип: экспорт не выполняется.');else if(a==='more')alert('Предлагаемые действия: переименовать, экспортировать, удалить. В прототипе данные не меняются.')});const search=$('#meeting-search');if(search)search.oninput=()=>{filterRows(search.value,activeFilter)};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))});filterRows(search?.value||'',b.dataset.filter)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$('#document-body').innerHTML=b.dataset.tab==='summary'?'<div class="notice"><strong>Итоги встречи</strong><p style="margin:12px 0 0">Обсуждены единый список встреч, заметный режим записи и возврат к сохранённой расшифровке.</p><p style="margin:10px 0 0;font-size:11px">Вымышленный пример готового результата для macOS.</p></div>':'<div class="doc-intro">Участники определены после обработки</div>'+turns()+source()});const ts=$('#timeline-search');if(ts)ts.oninput=()=>document.querySelectorAll('.history-card').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(ts.value.toLowerCase()))}
function filterRows(query,filter='all'){let n=0;document.querySelectorAll('#meeting-list .meeting-row:not(.live-row)').forEach(el=>{const text=el.textContent.toLowerCase();const visible=text.includes(query.toLowerCase())&&(filter==='all'||text.includes(filter==='room'?'комнат':'онлайн'));el.hidden=!visible;if(visible)n++});let empty=$('#search-empty');if(!empty){empty=document.createElement('div');empty.id='search-empty';empty.className='empty-search';$('#meeting-list').append(empty)}empty.hidden=n>0;empty.textContent=n?'':'Нет встреч по этому запросу. Измените запрос или выберите «Все».'}
$('#concept').onchange=e=>go(state,e.target.value);$('#state').onchange=e=>{processingActive=e.target.value==='processing';recoveryActive=e.target.value==='recovery';go(e.target.value)};$('#theme').onchange=e=>{theme=e.target.value;go(state)};render();
</script>
</html>
